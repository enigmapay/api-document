const crypto = require("crypto");
const RSA_PRIVATE_KEY_PEM = "YOUR_RSA_PRIVATE_KEY_PEM";
const TIMESTAMP = Date.now();
const BODY = {
  clientId: "YOUR_CLIENT_ID",
  merchantId: "YOUR_MERCHANT_ID",
  timestamp: TIMESTAMP,
  // ...other body fields
};
const canonicalString = Object.keys(BODY)
  .filter(k => k !== "signature")
  .sort()
  .map(k => `${k}=${BODY[k]}`)
  .join("&");
const signer = crypto.createSign("RSA-SHA256");
signer.update(canonicalString);
const signature = signer.sign(RSA_PRIVATE_KEY_PEM, "base64");

  <script type="text/plain" id="code-java">
import java.security.*;
import java.util.*;
import java.util.Base64;
public class SignatureGenerator {
    public static String createSignature(Map<String, String> body, PrivateKey privateKey) throws Exception {
        List<String> keys = new ArrayList<>(body.keySet());
        keys.remove("signature");
        Collections.sort(keys);
        StringBuilder sb = new StringBuilder();
        for (int i = 0; i < keys.size(); i++) {
            if (i > 0) sb.append("&");
            sb.append(keys.get(i)).append("=").append(body.get(keys.get(i)));
        }
        Signature signer = Signature.getInstance("SHA256withRSA");
        signer.initSign(privateKey);
        signer.update(sb.toString().getBytes("UTF-8"));
        return Base64.getEncoder().encodeToString(signer.sign());
    }
}

  <script type="text/plain" id="code-csharp">
using System;
using System.Collections.Generic;
using System.Linq;
using System.Security.Cryptography;
using System.Text;
public class SignatureGenerator
{
    public static string CreateSignature(Dictionary<string, string> body, RSA rsa)
    {
        var keys = body.Keys.Where(k => k != "signature").OrderBy(k => k).ToList();
        var canonicalString = string.Join("&", keys.Select(k => $"{k}={body[k]}"));
        var data = Encoding.UTF8.GetBytes(canonicalString);
        var signatureBytes = rsa.SignData(data, HashAlgorithmName.SHA256, RSASignaturePadding.Pkcs1);
        return Convert.ToBase64String(signatureBytes);
    }
}

    // --- MAIN APP COMPONENT ---
    function App() {
      const [activeTab, setActiveTab] = useState("overview");
      const [strictValidationMode, setStrictValidationMode] = useState({});
      const [searchQuery, setSearchQuery] = useState("");
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [selectedCodeLang, setSelectedCodeLang] = useState("javascript");

      const toggleEndpointStrict = (id) => {
        setStrictValidationMode(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const activeEndpoint = useMemo(() => {
        for (const folder of API_SCHEMA.folders) {
          const found = folder.endpoints.find(e => e.id === activeTab);
          if (found) return { ...found, folderName: folder.name };
        }
        return null;
      }, [activeTab]);

      const searchResults = useMemo(() => {
        if (!searchQuery.trim()) return [];
        const q = searchQuery.toLowerCase();
        const results = [];
        API_SCHEMA.folders.forEach(f => {
          f.endpoints.forEach(e => {
            const inParams = (e.params || []).some(p => p.field.toLowerCase().includes(q));
            if (e.name.toLowerCase().includes(q) || e.path.toLowerCase().includes(q) || e.description.toLowerCase().includes(q) || inParams) {
              results.push({ ...e, folder: f.name });
            }
          });
        });
        return results;
      }, [searchQuery]);

      return (
        <div className="min-h-screen flex flex-col bg-bgDark text-textPrimary">
          {/* TOP NAVBAR */}
          <header className="h-16 border-b border-borderDark bg-bgSecondary/90 backdrop-blur sticky top-0 z-40 px-4 md:px-6 flex items-center justify-between">
            <div className="flex items-center gap-4">
              <button onClick={() => setMobileMenuOpen(!mobileMenuOpen)} className="md:hidden text-textSecondary hover:text-white text-xl">
                <i className="fa-solid fa-bars"></i>
              </button>
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setActiveTab("overview")}>
                <img src="https://raw.githubusercontent.com/enigmapay/api-document/main/enigmapay-logo.png" alt="ENIGMAPAY Logo" className="h-9 w-auto object-contain" />
              </div>
            </div>

            {/* SEARCH BAR */}
            <div className="relative flex-1 max-w-md mx-4 hidden sm:block">
              <i className="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-textSecondary text-sm"></i>
              <input
                type="text"
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                placeholder="Search documentation, endpoints, parameters..."
                className="w-full bg-cardBg border border-borderDark rounded-lg pl-10 pr-4 py-2 text-sm text-textPrimary placeholder-textSecondary focus:outline-none focus:border-primaryPurple transition-colors"
              />
              {searchQuery && (
                <div className="absolute left-0 right-0 top-full mt-2 bg-cardBgElevated border border-borderDark rounded-xl shadow-2xl max-h-96 overflow-y-auto z-50 p-2">
                  {searchResults.length === 0 ? (
                    <div className="p-4 text-center text-textSecondary text-sm">No matching documentation endpoints found</div>
                  ) : (
                    searchResults.map(res => (
                      <div
                        key={res.id}
                        onClick={() => { setActiveTab(res.id); setSearchQuery(""); }}
                        className="p-3 hover:bg-cardBgHover rounded-lg cursor-pointer flex items-center justify-between border-b border-borderDark/40 last:border-0"
                      >
                        <div>
                          <div className="text-xs text-primaryPurple font-semibold">{res.folder}</div>
                          <div className="text-sm font-medium text-white">{res.name}</div>
                          <div className="text-xs font-mono text-textSecondary">{res.path}</div>
                        </div>
                        <MethodBadge method={res.method} />
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>

            <div className="flex items-center gap-3">
              <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cardBg border border-borderDark text-xs font-mono text-emerald-400">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                v1.0.0 Live
              </span>
            </div>
          </header>

          <div className="flex-1 flex relative overflow-hidden">
            {/* LEFT SIDEBAR */}
            <aside className={`
              fixed md:static inset-y-0 left-0 z-30
              w-64 bg-bgSecondary border-r border-borderDark flex flex-col transition-transform duration-300
              ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}
            `}>
              <div className="p-4 overflow-y-auto flex-1 space-y-6">
                <div>
                  <div className="text-[11px] font-bold text-textSecondary tracking-wider uppercase mb-2 px-2">Getting Started</div>
                  <div className="space-y-1">
                    {API_SCHEMA.sections.map(sec => (
                      <button
                        key={sec.id}
                        onClick={() => { setActiveTab(sec.id); setMobileMenuOpen(false); }}
                        className={`
                          w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium transition-all text-left
                          ${activeTab === sec.id
                            ? 'bg-primaryPurple/15 text-primaryPurple border-l-2 border-primaryPurple font-semibold'
                            : 'text-textSecondary hover:text-white hover:bg-cardBg'}
                        `}
                      >
                        <i className={`fa-solid ${sec.icon} w-4 text-center text-sm`}></i>
                        <span>{sec.title}</span>
                      </button>
                    ))}
                  </div>
                </div>

                <div>
                  <div className="text-[11px] font-bold text-textSecondary tracking-wider uppercase mb-2 px-2 flex items-center justify-between">
                    <span>API Reference</span>
                    <span className="text-[10px] bg-cardBg px-1.5 py-0.5 rounded text-textSecondary border border-borderDark">REST</span>
                  </div>
                  <div className="space-y-4">
                    {API_SCHEMA.folders.map(folder => (
                      <div key={folder.name} className="space-y-1">
                        <div className="px-2 py-1 text-xs font-semibold text-textPrimary flex items-center gap-2">
                          <i className={`fa-solid ${folder.icon} text-primaryPurple text-xs`}></i>
                          <span>{folder.name}</span>
                        </div>
                        <div className="pl-4 space-y-1 border-l border-borderDark/60 ml-3">
                          {folder.endpoints.map(ep => (
                            <button
                              key={ep.id}
                              onClick={() => { setActiveTab(ep.id); setMobileMenuOpen(false); }}
                              className={`
                                w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs transition-all text-left
                                ${activeTab === ep.id
                                  ? 'bg-cardBgElevated text-primaryPurple font-semibold border border-primaryPurple/30'
                                  : 'text-textSecondary hover:text-white hover:bg-cardBg'}
                              `}
                            >
                              <span className="truncate pr-2">{ep.name}</span>
                              <MethodBadge method={ep.method} mini />
                            </button>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="p-3 border-t border-borderDark bg-cardBg/40 text-[11px] text-textSecondary flex items-center justify-between">
                <span>ENIGMAPAY API Document</span>
              </div>
            </aside>

            {/* MAIN CONTENT AREA */}
            <main className="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10 bg-bgDark">
              <div className="max-w-5xl mx-auto space-y-10">
                {activeTab === "overview" && <OverviewPage onNavigate={(tab) => setActiveTab(tab)} />}
                {activeTab === "getting-started" && <GettingStartedPage onNavigate={(tab) => setActiveTab(tab)} />}
                {activeTab === "authentication" && <AuthenticationPage selectedLang={selectedCodeLang} setSelectedLang={setSelectedCodeLang} />}
                {activeTab === "strict-validation-guide" && <StrictValidationGuidePage />}
                {activeEndpoint && (
                  <EndpointDetailPage
                    key={activeEndpoint.id}
                    endpoint={activeEndpoint}
                    isStrict={!!strictValidationMode[activeEndpoint.id]}
                    onToggleStrict={() => toggleEndpointStrict(activeEndpoint.id)}
                  />
                )}
              </div>
            </main>
          </div>
        </div>
      );
    }

    // --- SUB-COMPONENTS ---

    function MethodBadge({ method, mini }) {
      const colors = {
        GET: "bg-blue-500/10 text-blue-400 border-blue-500/30",
        POST: "bg-emerald-500/10 text-emerald-400 border-emerald-500/30",
        PUT: "bg-amber-500/10 text-amber-400 border-amber-500/30",
        DELETE: "bg-rose-500/10 text-rose-400 border-rose-500/30"
      };
      return (
        <span className={`
          font-mono font-bold rounded border uppercase tracking-wider
          ${colors[method] || "bg-gray-500/10 text-gray-400 border-gray-500/30"}
          ${mini ? "text-[9px] px-1.5 py-0.2" : "text-xs px-2.5 py-1"}
        `}>
          {method}
        </span>
      );
    }

    function CopyButton({ text }) {
      const [copied, setCopied] = useState(false);
      const handleCopy = () => {
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };
      return (
        <button onClick={handleCopy} className="text-textSecondary hover:text-white text-xs px-2 py-1 rounded bg-cardBg border border-borderDark transition-colors flex items-center gap-1.5">
          <i className={`fa-regular ${copied ? 'fa-check text-emerald-400' : 'fa-copy'}`}></i>
          <span>{copied ? 'Copied' : 'Copy'}</span>
        </button>
      );
    }

    function CodeBlock({ code, language = "json" }) {
      return (
        <div className="relative group rounded-xl bg-cardBg border border-borderDark overflow-hidden my-3">
          <div className="flex items-center justify-between px-4 py-2 bg-cardBgElevated border-b border-borderDark text-xs font-mono text-textSecondary">
            <span>{language.toUpperCase()}</span>
            <CopyButton text={code} />
          </div>
          <pre className="p-4 text-xs font-mono text-emerald-300 overflow-x-auto leading-relaxed max-h-[32rem]">
            <code>{code}</code>
          </pre>
        </div>
      );
    }

    function Inline({ children }) {
      return <code className="text-primaryPurple font-mono">{children}</code>;
    }

      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="border-b border-borderDark pb-6">

            <div className="bg-cardBg border border-borderDark p-5 rounded-2xl space-y-2 hover:border-primaryPurple/50 transition-colors">

              <h3 className="font-bold text-white text-base">Automatic Matching</h3>

              <h3 className="font-bold text-white text-base">Strict Validation Option</h3>

          <div className="space-y-6">
            <Step n="1" title="Obtain API Credentials">
              <p className="text-xs text-textSecondary mb-3">Your credentials are available in your <strong className="text-white">Client Back Office</strong>. Your Client BO login will be shared with you via email.</p>
              <ul className="text-xs text-textSecondary space-y-1.5 font-mono bg-bgDark p-3 rounded-lg border border-borderDark">
                <li>• <strong className="text-white">API Key (x-api-key):</strong> unique identifier used to authenticate your API requests</li>
                <li>• <strong className="text-white">Secret Key:</strong> used to verify webhook callback authenticity (no longer used to sign API requests)</li>
                <li>• <strong className="text-white">Merchant ID:</strong> identifier assigned to your business for API transactions</li>
                <li>• <strong className="text-white">Client ID:</strong> identifier for the client initiating transactions</li>
                <li>• <strong className="text-white">RSA Private Key:</strong> your private key (PEM format) used to sign API requests. Keep it strictly private</li>
                <li>• <strong className="text-white">RSA Public Key:</strong> your public key (PEM format) registered with ENIGMAPAY for signature verification</li>
              </ul>
            </Step>

            <Step n="2" title="Create a Signature">
              <p className="text-xs text-textSecondary">
                Before making requests, create an RSA signature (RSASSA-PKCS1-v1_5 / SHA-256) of the canonical string of the request body using your <Inline>RSA_PRIVATE_KEY</Inline>, then Base64-encode it into the <Inline>signature</Inline> field.{" "}
                <button onClick={() => onNavigate("authentication")} className="text-primaryPurple hover:underline font-semibold">See Authentication & Signature</button>
              </p>
            </Step>

            <Step n="3" title="Send Requests">

            </Step>

              <p className="text-xs text-textSecondary">
                Configure an HTTPS endpoint to receive transaction updates: deposits notify on <Inline>completed</Inline> or <Inline>expired</Inline>; payouts notify on <Inline>processing</Inline>, <Inline>failed</Inline>, <Inline>rejected</Inline> or <Inline>completed</Inline>.
                Respond with <Inline>{'{"webhookResponse": "success"}'}</Inline>. The <Inline>hash</Inline> field is the AES-encrypted <Inline>transactionId</Inline>, keyed with <Inline>API_KEY</Inline> + <Inline>SECRET_KEY</Inline>.
              </p>
            </Step>
          </div>
        </div>
      );
    }

    // --- AUTHENTICATION & SIGNATURE PAGE ---
    function AuthenticationPage({ selectedLang, setSelectedLang }) {
      const langs = [
        { id: 'javascript', label: 'JavaScript (Node.js)' },
        { id: 'java', label: 'Java' },
        { id: 'php', label: 'PHP' },
        { id: 'csharp', label: 'C#' }
      ];
      const getCode = (id) => (document.getElementById('code-' + id) || {}).textContent || '';

      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="border-b border-borderDark pb-6">
            <h1 className="text-3xl font-extrabold text-white tracking-tight mb-2">Authentication & RSA Signature</h1>
            <p className="text-textSecondary text-sm max-w-3xl">
              To authenticate requests you must generate a secure <strong className="text-white">RSA signature</strong> using <strong className="text-white">RSASSA-PKCS1-v1_5 / SHA-256</strong> (RS256). The signature proves the request was sent by an authorized client and has not been tampered with. It is derived from the canonical string of the request body, signed with your RSA Private Key.
            </p>
          </div>

          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white flex items-center gap-2"><i className="fa-solid fa-list-ol text-primaryPurple"></i>General Steps</h2>
            <ol className="text-xs text-textSecondary space-y-3 list-decimal pl-5">
              <li>
                <strong className="text-white">Build the canonical string:</strong> take all body fields <em>except</em> <Inline>signature</Inline>, sort the keys alphabetically, and join them as <Inline>key=value&key=value</Inline>.
                <div className="mt-2 text-[11px]">Example: given <Inline>{'{ "merchantId": "ABC", "clientId": "XYZ", "timestamp": 1767000966705 }'}</Inline> the canonical string is:</div>
                <CodeBlock code={"clientId=XYZ&merchantId=ABC&timestamp=1767000966705"} language="text" />
              </li>
              <li><strong className="text-white">Sign the canonical string:</strong> sign it with your RSA Private Key using RSASSA-PKCS1-v1_5 / SHA-256.</li>
              <li><strong className="text-white">Base64-encode the result:</strong> the binary signature bytes must be Base64-encoded before being placed in the <Inline>signature</Inline> field.</li>
            </ol>
          </div>

          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white flex items-center gap-2"><i className="fa-solid fa-code text-primaryPurple"></i>Language Implementations</h2>
            <div className="flex gap-2 border-b border-borderDark pb-2 overflow-x-auto">
              {langs.map(l => (
                <button
                  key={l.id}
                  onClick={() => setSelectedLang(l.id)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono whitespace-nowrap transition-all ${selectedLang === l.id ? 'bg-primaryPurple text-white font-bold' : 'text-textSecondary hover:text-white bg-bgDark'}`}
                >
                  {l.label}
                </button>
              ))}
            </div>
            <CodeBlock code={getCode(selectedLang)} language={selectedLang} />
          </div>

          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-3">
            <h2 className="text-base font-bold text-white flex items-center gap-2"><i className="fa-solid fa-paper-plane text-primaryPurple"></i>How to Use the Signature</h2>
            <p className="text-xs text-textSecondary">Include the signature in every API request as part of the request body:</p>
            <CodeBlock code={JSON.stringify({ clientId: "<YOUR_CLIENT_ID>", merchantId: "<YOUR_MERCHANT_ID>", signature: "<BASE64_RSA_SIGNATURE>", timestamp: "<TIMESTAMP>" }, null, 2)} language="json" />
          </div>

          <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 space-y-3">
            <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2"><i className="fa-solid fa-circle-info"></i>Important Considerations</h3>
            <ul className="space-y-2 text-xs text-amber-200/90 leading-relaxed">
              <li><strong className="text-amber-400">Algorithm:</strong> RSASSA-PKCS1-v1_5 / SHA-256 (RS256) for all integrations.</li>
              <li><strong className="text-amber-400">Key pair:</strong> register your RSA Public Key with ENIGMAPAY. Keep your RSA Private Key private and secure; never share it.</li>
              <li><strong className="text-amber-400">Canonical string:</strong> sort all body fields alphabetically by key (excluding <code>signature</code>), then join as <code>key=value&key=value</code>. JSON field order in the payload does not matter; only the canonical string order does.</li>
              <li><strong className="text-amber-400">Timestamp tolerance:</strong> the <code>timestamp</code> must be within 5 minutes of the server time to prevent replay attacks. Reuse the same <code>timestamp</code> value in the request body that you used when building the signature.</li>
              <li><strong className="text-amber-400">Single use:</strong> the signature must be single-use; the timestamp changes each time you generate a request.</li>
            </ul>
          </div>
        </div>
      );
    }

    // --- STRICT VALIDATION GUIDE PAGE ---
    function StrictValidationGuidePage() {
      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="border-b border-borderDark pb-6">
            <h1 className="text-3xl font-extrabold text-white tracking-tight mb-2">Strict Validation Guide</h1>
            <p className="text-textSecondary text-sm max-w-3xl">
              Reference on the optional ENIGMAPAY strict merchant validation policies designed to prevent First-Time Deposit (FTD) exploits and unauthorized payouts. The strict fields on Create Deposit and Create Payout are required only if the Strict Validation option is enabled for your merchant.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-rose-400 text-lg font-bold">Rule 1</div>
              <h3 className="text-white font-bold text-sm">Same-Day Register Block</h3>
              <p className="text-xs text-textSecondary">Transactions are not allowed on the same day a player registers. The system compares <Inline>lastRegisterDate</Inline> with the transaction date.</p>
            </div>
            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-amber-400 text-lg font-bold">Rule 2</div>
              <h3 className="text-white font-bold text-sm">Single Bank Account Lock</h3>
              <p className="text-xs text-textSecondary">Each player (<Inline>platformUserId</Inline>) may use only one bank account for deposits and payouts. Different <Inline>bankAccountNumber</Inline> or <Inline>bankName</Inline> values are detected across <strong className="text-white">completed</strong> transactions only.</p>
            </div>
            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-emerald-400 text-lg font-bold">Rule 3</div>
              <h3 className="text-white font-bold text-sm">Turnover & Deposit Requirement</h3>
              <p className="text-xs text-textSecondary">Provide <Inline>totalTurnover</Inline> of at least 300,000 THB, or <Inline>totalDepositAmount</Inline> of at least 100,000 THB. One of the two is required.</p>
            </div>
          </div>

          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-3">
            <h2 className="text-base font-bold text-white">Strict-only fields</h2>
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="border-b border-borderDark text-textSecondary font-mono uppercase text-[10px]">
                    <th className="py-2.5 px-3">Field</th><th className="py-2.5 px-3">Deposit</th><th className="py-2.5 px-3">Payout</th><th className="py-2.5 px-3">Notes</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-borderDark/60">
                  {[
                    ["bankAccountHolderName", "Yes", "Yes", "Use only one holder name for deposits and withdrawals under the same player account"],
                    ["lastDepositDate", "Yes", "Yes", "ISO 8601"],
                    ["lastWithdrawalDate", "-", "Yes", "ISO 8601"],
                    ["lastRegisterDate", "Yes", "Yes", "ISO 8601, actual registration date on the merchant platform"],
                    ["totalDepositAmount", "Yes*", "Yes*", "THB, minimum 100000. *Required if totalTurnover is omitted"],
                    ["totalTurnover", "Yes*", "Yes*", "THB, minimum 300000. *Required if totalDepositAmount is omitted"],
                    ["platformUserId", "Yes", "Yes", "Unique user ID from the merchant platform"]
                  ].map((r, i) => (
                    <tr key={i}>
                      <td className="py-2.5 px-3 font-mono font-bold text-primaryPurple">{r[0]}</td>
                      <td className="py-2.5 px-3 text-white">{r[1]}</td>
                      <td className="py-2.5 px-3 text-white">{r[2]}</td>
                      <td className="py-2.5 px-3 text-textSecondary">{r[3]}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // --- ENDPOINT DETAIL PAGE WITH STRICT VALIDATION TOGGLE ---
    function EndpointDetailPage({ endpoint, isStrict, onToggleStrict }) {
      const [exIdx, setExIdx] = useState(0);
      const examples = endpoint.responseExamples || [];
      const example = examples[exIdx] || examples[0];

      const isStrictField = (p) => p.req === "Strict Only" || p.req === "Strict Only*";
      const strictKeys = new Set((endpoint.params || []).filter(isStrictField).map(p => p.field));
      const visibleBody = endpoint.body
        ? Object.fromEntries(Object.entries(endpoint.body).filter(([k]) => isStrict || !strictKeys.has(k)))
        : null;
      const visibleParams = (endpoint.params || []).filter(p => isStrict || !isStrictField(p));

      return (
        <div className="space-y-8 animate-fadeIn">
          {/* HEADER AREA */}
          <div className="border-b border-borderDark pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-3 mb-2 flex-wrap">
                <MethodBadge method={endpoint.method} />
                <span className="font-mono text-xs text-textSecondary bg-cardBg px-3 py-1 rounded-lg border border-borderDark break-all">{endpoint.path}</span>
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">{endpoint.name}</h1>
              <p className="text-xs text-textSecondary mt-1 max-w-3xl">{endpoint.description}</p>
            </div>

            {endpoint.hasStrictValidation && (
              <div className="bg-cardBg border border-borderDark p-3 rounded-2xl flex items-center gap-4 shrink-0 purple-glow-sm">
                <div>
                  <div className="text-xs font-bold text-white flex items-center gap-1.5"><i className="fa-solid fa-shield-halved text-primaryPurple"></i>Strict Validation</div>
                  <div className="text-[10px] text-textSecondary">FTD & Multi-account checks</div>
                </div>
                <button onClick={onToggleStrict} className={`w-12 h-6 rounded-full p-1 transition-colors relative flex items-center ${isStrict ? 'bg-primaryPurple' : 'bg-borderDark'}`}>
                  <div className={`w-4 h-4 rounded-full bg-white transition-transform transform ${isStrict ? 'translate-x-6' : 'translate-x-0'}`}></div>
                </button>
              </div>
            )}
          </div>

          {/* HEADERS */}
          {endpoint.headers && endpoint.headers.length > 0 && (
            <div className="bg-cardBg border border-borderDark rounded-2xl p-5 space-y-2">
              <h2 className="text-xs font-bold text-white uppercase tracking-wider">Headers</h2>
              <div className="space-y-1.5">
                {endpoint.headers.map((h, i) => (
                  <div key={i} className="flex flex-wrap items-center gap-3 text-xs font-mono">
                    <span className="text-primaryPurple font-bold">{h.key}</span>
                    <span className="text-textSecondary">{h.value}</span>
                    {h.required && <span className="text-[10px] text-emerald-400 font-bold">REQUIRED</span>}
                    {h.desc && <span className="text-textSecondary font-sans">{h.desc}</span>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ENDPOINT NOTES */}
          {endpoint.endpointNotes && endpoint.endpointNotes.length > 0 && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 space-y-3">
              <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2"><i className="fa-solid fa-circle-info"></i>Important Integration Notes</h3>
              <div className="space-y-2">
                {endpoint.endpointNotes.map((note, index) => (
                  <div key={index} className="text-xs text-amber-200/90 leading-relaxed flex items-start gap-2">
                    <span className="font-bold text-amber-400 shrink-0">•</span><span>{note}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* STRICT VALIDATION SECTION */}
          {endpoint.hasStrictValidation && isStrict && endpoint.strictValidationDetails && (
            <div className="bg-cardBg border-2 border-primaryPurple/50 rounded-2xl p-6 space-y-6 purple-glow animate-fadeIn">
              <div className="flex items-center justify-between border-b border-borderDark pb-4">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-primaryPurple animate-ping"></span>
                  <h2 className="font-bold text-white uppercase tracking-wider text-xs">Strict Validation Enabled</h2>
                </div>
                <span className="text-[10px] bg-primaryPurple/20 text-primaryPurple px-2 py-0.5 rounded font-mono font-bold">ACTIVE</span>
              </div>

              <p className="text-xs text-textSecondary leading-relaxed">{endpoint.strictValidationDetails.explanation}</p>

              <div className="space-y-2">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider">Validation Rules</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {endpoint.strictValidationDetails.rules.map((r, idx) => (
                    <div key={idx} className="bg-bgDark p-3 rounded-xl border border-borderDark space-y-1">
                      <div className="text-xs font-bold text-primaryPurple">{r.rule}</div>
                      <div className="text-[11px] text-textSecondary">{r.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <div className="text-xs font-bold text-emerald-400 mb-2 flex items-center gap-1.5"><i className="fa-solid fa-circle-check"></i>EXAMPLE VALID PAYLOAD</div>
                  <CodeBlock code={JSON.stringify(endpoint.strictValidationDetails.validPayload, null, 2)} language="json" />
                </div>
                <div>
                  <div className="text-xs font-bold text-rose-400 mb-2 flex items-center gap-1.5"><i className="fa-solid fa-circle-xmark"></i>EXAMPLE INVALID PAYLOAD</div>
                  <CodeBlock code={JSON.stringify(endpoint.strictValidationDetails.invalidPayload, null, 2)} language="json" />
                  <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-xl text-[11px] mt-2">
                    <strong>Rejection Reason:</strong> {endpoint.strictValidationDetails.invalidReason}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PARAMETERS TABLE */}
          {visibleParams.length > 0 && (
            <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-4">
              <h2 className="text-base font-bold text-white flex items-center justify-between">
                <span>Parameters & Payload Fields</span>
                {endpoint.hasStrictValidation && <span className="text-xs text-textSecondary font-normal">{isStrict ? "Showing Strict Fields" : "Standard View"}</span>}
              </h2>
              <div className="overflow-x-auto">
                <table className="w-full text-left text-xs border-collapse">
                  <thead>
                    <tr className="border-b border-borderDark text-textSecondary font-mono uppercase text-[10px]">
                      <th className="py-2.5 px-3">Field</th><th className="py-2.5 px-3">Type</th><th className="py-2.5 px-3">Required</th><th className="py-2.5 px-3">Description</th><th className="py-2.5 px-3">Example</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-borderDark/60">
                    {visibleParams.map((p, i) => (
                      <tr key={i} className="hover:bg-cardBgHover/50 transition-colors">
                        <td className="py-2.5 px-3 font-mono font-bold text-primaryPurple">{p.field}</td>
                        <td className="py-2.5 px-3 font-mono text-textSecondary">{p.type}</td>
                        <td className="py-2.5 px-3">
                          {p.req === true && <span className="text-emerald-400 font-bold">YES</span>}
                          {p.req === false && <span className="text-textSecondary">NO</span>}
                          {p.req === "Conditional" && <span className="text-amber-400 font-bold">CONDITIONAL</span>}
                          {isStrictField(p) && <span className="text-primaryPurple font-bold bg-primaryPurple/10 px-2 py-0.5 rounded border border-primaryPurple/30">STRICT{p.req === "Strict Only*" ? "*" : ""}</span>}
                        </td>
                        <td className="py-2.5 px-3 text-textSecondary">{p.desc || "-"}</td>
                        <td className="py-2.5 px-3 font-mono text-white break-all">{p.ex || "-"}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              {isStrict && <p className="text-[11px] text-textSecondary">* Provide at least one of <Inline>totalDepositAmount</Inline> or <Inline>totalTurnover</Inline>.</p>}
            </div>
          )}

          {/* REQUEST / RESPONSE */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <h2 className="text-sm font-bold text-white mb-2">{endpoint.method === "GET" ? "Request Body" : "Request Body Payload"}</h2>
              <CodeBlock code={visibleBody ? JSON.stringify(visibleBody, null, 2) : "// No Request Body Required"} language="json" />
            </div>

            <div className="space-y-3">
              <h2 className="text-sm font-bold text-white mb-2">{endpoint.responseLabel || "Sample Response"}</h2>
              {examples.length > 1 && (
                <div className="flex gap-2 flex-wrap">
                  {examples.map((ex, i) => (
                    <button key={i} onClick={() => setExIdx(i)} className={`px-3 py-1 rounded-lg text-[11px] font-mono transition-all ${exIdx === i ? 'bg-primaryPurple text-white font-bold' : 'text-textSecondary hover:text-white bg-cardBg border border-borderDark'}`}>
                      {ex.label}
                    </button>
                  ))}
                </div>
              )}
              {example && <CodeBlock code={JSON.stringify(example.body, null, 2)} language="json" />}

              {endpoint.responseNotes && endpoint.responseNotes.length > 0 && (
                <div className="bg-primaryPurple/10 border border-primaryPurple/30 rounded-xl p-4 space-y-2">
                  <div className="text-xs font-bold text-lightPurple flex items-center gap-1.5"><i className="fa-solid fa-lightbulb"></i>Response Handling Notes</div>
                  {endpoint.responseNotes.map((note, index) => (
                    <p key={index} className="text-xs text-textSecondary leading-relaxed">{note}</p>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // RENDER REACT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
