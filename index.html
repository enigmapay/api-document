const SECRET_KEY = "ENG_SEC_9x8v7c6b5a4m";
const TIMESTAMP = Date.now();

const PAYLOAD = {
  "merchantId": "MERCH_882910",

};

const signature = jwt.sign(PAYLOAD, SECRET_KEY);`,
        java: `import io.jsonwebtoken.Jwts;
import io.jsonwebtoken.SignatureAlgorithm;

public class SignatureGenerator {
    public static String createSignature(String merchantId, String clientId, String secretKey) {
        long timestamp = System.currentTimeMillis() / 1000L;
        return Jwts.builder()
                .setSubject("Signature")
                .claim("merchantId", merchantId)
                .claim("clientId", clientId)
                .claim("iat", timestamp)
                .signWith(SignatureAlgorithm.HS256, secretKey.getBytes())
                .compact();
    }
}`,
        php: `<?php
require 'vendor/autoload.php';
use \\Firebase\\JWT\\JWT;

$merchantId = "MERCH_882910";
$clientId = "CLI_994012";
$secretKey = "ENG_SEC_9x8v7c6b5a4m";
$timestamp = time();

$payload = array(
    "merchantId" => $merchantId,
    "clientId" => $clientId,
    "iat" => $timestamp
);

$jwt = JWT::encode($payload, $secretKey, 'HS256');
echo $jwt;
?>`,
        csharp: `using System;
using System.IdentityModel.Tokens.Jwt;
using Microsoft.IdentityModel.Tokens;

public class SignatureGenerator {
    public static string CreateSignature(string merchantId, string clientId, string secretKey) {
        var timestamp = DateTimeOffset.UtcNow.ToUnixTimeMilliseconds();
        var securityKey = new SymmetricSecurityKey(System.Text.Encoding.UTF8.GetBytes(secretKey));
        var credentials = new SigningCredentials(securityKey, SecurityAlgorithms.HmacSha256);
        
        var payload = new JwtPayload {
            { "merchantId", merchantId },
            { "clientId", clientId },
            { "iat", timestamp }
        };
        
        var token = new JwtSecurityToken(new JwtHeader(credentials), payload);
        return new JwtSecurityTokenHandler().WriteToken(token);
    }
}`

          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white flex items-center gap-2">
              <i className="fa-solid fa-code text-primaryPurple"></i>
              Language Implementations
            </h2>

            <div className="flex gap-2 border-b border-borderDark pb-2 overflow-x-auto">
              {['javascript', 'java', 'php', 'csharp'].map(lang => (
                <button
                  key={lang}
                  onClick={() => setSelectedLang(lang)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-mono capitalize transition-all ${
                    selectedLang === lang ? 'bg-primaryPurple text-white font-bold' : 'text-textSecondary hover:text-white bg-bgDark'
                  }`}
                >
                  {lang}
                </button>
              ))}
            </div>

            <CodeBlock code={codeExamples[selectedLang]} language={selectedLang} />
          </div>
        </div>
      );
    }

    // --- STRICT VALIDATION GUIDE PAGE ---
    function StrictValidationGuidePage() {
      return (
        <div className="space-y-8 animate-fadeIn">
          <div className="border-b border-borderDark pb-6">
            <h1 className="text-3xl font-extrabold text-white tracking-tight mb-2">Strict Validation Guide</h1>
            <p className="text-textSecondary text-sm">
              Comprehensive reference on ENIGMAPAY optional strict merchant validation policies designed to eliminate First-Time Deposit (FTD) exploits and unauthorized payouts.
            </p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-rose-400 text-lg font-bold">Rule 1</div>
              <h3 className="text-white font-bold text-sm">Same-Day Register Block</h3>
              <p className="text-xs text-textSecondary">
                Players cannot execute deposits or payouts on the exact same date as their account registration (<code className="text-primaryPurple font-mono">lastRegisterDate</code>).
              </p>
            </div>

            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-amber-400 text-lg font-bold">Rule 2</div>
              <h3 className="text-white font-bold text-sm">Single Bank Account Lock</h3>
              <p className="text-xs text-textSecondary">
                Each player (<code className="text-primaryPurple font-mono">platformUserId</code>) is bound strictly to one bank account number and bank name across all completed transactions.
              </p>
            </div>

            <div className="bg-cardBg border border-borderDark p-5 rounded-xl space-y-2">
              <div className="text-emerald-400 text-lg font-bold">Rule 3</div>
              <h3 className="text-white font-bold text-sm">Turnover & Deposit Metric Requirement</h3>
              <p className="text-xs text-textSecondary">
                Transactions must specify at least one cumulative metric: <code className="text-primaryPurple font-mono">totalTurnover</code> (e.g. 450,000 THB) or <code className="text-primaryPurple font-mono">totalDepositAmount</code> (e.g. 100,000 THB).
              </p>
            </div>
          </div>
        </div>
      );
    }

    // --- ENDPOINT DETAIL PAGE WITH STRICT VALIDATION TOGGLE ---
    function EndpointDetailPage({ endpoint, isStrict, onToggleStrict }) {
      return (
        <div className="space-y-8 animate-fadeIn">
          {/* HEADER AREA */}
          <div className="border-b border-borderDark pb-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <MethodBadge method={endpoint.method} />
                <span className="font-mono text-xs text-textSecondary bg-cardBg px-3 py-1 rounded-lg border border-borderDark">
                  {endpoint.path}
                </span>
              </div>
              <h1 className="text-2xl font-extrabold text-white tracking-tight">{endpoint.name}</h1>
              <p className="text-xs text-textSecondary mt-1">{endpoint.description}</p>
            </div>

            {/* STRICT VALIDATION TOGGLE */}
            {endpoint.hasStrictValidation && (
              <div className="bg-cardBg border border-borderDark p-3 rounded-2xl flex items-center gap-4 shrink-0 purple-glow-sm">
                <div>
                  <div className="text-xs font-bold text-white flex items-center gap-1.5">
                    <i className="fa-solid fa-shield-halved text-primaryPurple"></i>
                    Strict Validation
                  </div>
                  <div className="text-[10px] text-textSecondary">FTD & Multi-account checks</div>
                </div>

                <button
                  onClick={onToggleStrict}
                  className={`
                    w-12 h-6 rounded-full p-1 transition-colors relative flex items-center
                    ${isStrict ? 'bg-primaryPurple' : 'bg-borderDark'}
                  `}
                >
                  <div className={`
                    w-4 h-4 rounded-full bg-white transition-transform transform
                    ${isStrict ? 'translate-x-6' : 'translate-x-0'}
                  `}></div>
                </button>
              </div>
            )}
          </div>

          {/* ENDPOINT NOTES / IMPORTANT REMINDERS */}
          {endpoint.endpointNotes && endpoint.endpointNotes.length > 0 && (
            <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-5 space-y-3">
              <h3 className="text-xs font-bold text-amber-400 uppercase tracking-wider flex items-center gap-2">
                <i className="fa-solid fa-circle-info"></i>
                Important Integration Notes
              </h3>
              <div className="space-y-2">
                {endpoint.endpointNotes.map((note, index) => (
                  <div key={index} className="text-xs text-amber-200/90 leading-relaxed flex items-start gap-2">
                    <span className="font-bold text-amber-400 shrink-0">•</span>
                    <span>{note}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* STRICT VALIDATION EXPANDABLE SECTION */}
          {endpoint.hasStrictValidation && isStrict && (
            <div className="bg-cardBg border-2 border-primaryPurple/50 rounded-2xl p-6 space-y-6 purple-glow animate-fadeIn">
              <div className="flex items-center justify-between border-b border-borderDark pb-4">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-primaryPurple animate-ping"></span>
                  <h2 className="text-base font-bold text-white uppercase tracking-wider text-xs">
                    Strict Validation Enabled
                  </h2>
                </div>
                <span className="text-[10px] bg-primaryPurple/20 text-primaryPurple px-2 py-0.5 rounded font-mono font-bold">
                  ACTIVE
                </span>
              </div>

              <p className="text-xs text-textSecondary leading-relaxed">
                {endpoint.strictValidationDetails.explanation}
              </p>

              {/* RULES LIST */}
              <div className="space-y-2">
                <h3 className="text-xs font-bold text-white uppercase tracking-wider">Validation Rules</h3>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                  {endpoint.strictValidationDetails.rules.map((r, idx) => (
                    <div key={idx} className="bg-bgDark p-3 rounded-xl border border-borderDark space-y-1">
                      <div className="text-xs font-bold text-primaryPurple">{r.rule}</div>
                      <div className="text-[11px] text-textSecondary">{r.desc}</div>
                    </div>
                  ))}
                </div>
              </div>

              {/* VALID VS INVALID COMPARISON */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <div className="text-xs font-bold text-emerald-400 mb-2 flex items-center gap-1.5">
                    <i className="fa-solid fa-circle-check"></i>
                    EXAMPLE VALID PAYLOAD
                  </div>
                  <CodeBlock code={JSON.stringify(endpoint.strictValidationDetails.validPayload, null, 2)} language="json" />
                </div>

                <div>
                  <div className="text-xs font-bold text-rose-400 mb-2 flex items-center gap-1.5">
                    <i className="fa-solid fa-circle-xmark"></i>
                    EXAMPLE INVALID PAYLOAD
                  </div>
                  <CodeBlock code={JSON.stringify(endpoint.strictValidationDetails.invalidPayload, null, 2)} language="json" />
                  <div className="bg-rose-500/10 border border-rose-500/30 text-rose-300 p-3 rounded-xl text-[11px] mt-2">
                    <strong>Rejection Reason:</strong> {endpoint.strictValidationDetails.invalidReason}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* PARAMETERS TABLE */}
          <div className="bg-cardBg border border-borderDark rounded-2xl p-6 space-y-4">
            <h2 className="text-base font-bold text-white flex items-center justify-between">
              <span>Parameters & Payload Fields</span>
              <span className="text-xs text-textSecondary font-normal">
                {isStrict ? "Showing Strict Fields" : "Standard View"}
              </span>
            </h2>

            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs border-collapse">
                <thead>
                  <tr className="border-b border-borderDark text-textSecondary font-mono uppercase text-[10px]">
                    <th className="py-2.5 px-3">Field</th>
                    <th className="py-2.5 px-3">Type</th>
                    <th className="py-2.5 px-3">Required</th>
                    <th className="py-2.5 px-3">Description</th>
                    <th className="py-2.5 px-3">Example</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-borderDark/60">
                  {endpoint.params
                    .filter(p => isStrict || p.req !== "Strict Only" && p.req !== "Strict Only*")
                    .map((p, i) => (
                      <tr key={i} className="hover:bg-cardBgHover/50 transition-colors">
                        <td className="py-2.5 px-3 font-mono font-bold text-primaryPurple">{p.field}</td>
                        <td className="py-2.5 px-3 font-mono text-textSecondary">{p.type}</td>
                        <td className="py-2.5 px-3">
                          {p.req === true && <span className="text-emerald-400 font-bold">YES</span>}
                          {p.req === false && <span className="text-textSecondary">NO</span>}
                          {p.req === "Conditional" && <span className="text-amber-400 font-bold">CONDITIONAL</span>}
                          {(p.req === "Strict Only" || p.req === "Strict Only*") && (
                            <span className="text-primaryPurple font-bold bg-primaryPurple/10 px-2 py-0.5 rounded border border-primaryPurple/30">STRICT</span>
                          )}
                        </td>
                        <td className="py-2.5 px-3 text-textSecondary">{p.desc || "-"}</td>
                        <td className="py-2.5 px-3 font-mono text-white">{p.ex || "-"}</td>
                      </tr>
                    ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* CODE REQUEST / RESPONSE PREVIEW */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <h2 className="text-sm font-bold text-white mb-2">Request Body Payload</h2>
              <CodeBlock 
                code={endpoint.body ? JSON.stringify(endpoint.body, null, 2) : "// No Request Body Required"} 
                language="json" 
              />
            </div>

            <div className="space-y-3">
              <h2 className="text-sm font-bold text-white mb-2">Sample 200 OK Response</h2>
              <CodeBlock 
                code={JSON.stringify(endpoint.responses[200], null, 2)} 
                language="json" 
              />

              {/* RESPONSE NOTES */}
              {endpoint.responseNotes && endpoint.responseNotes.length > 0 && (
                <div className="bg-primaryPurple/10 border border-primaryPurple/30 rounded-xl p-4 space-y-2">
                  <div className="text-xs font-bold text-lightPurple flex items-center gap-1.5">
                    <i className="fa-solid fa-lightbulb"></i>
                    Response Handling Notes
                  </div>
                  {endpoint.responseNotes.map((note, index) => (
                    <p key={index} className="text-xs text-textSecondary leading-relaxed">
                      {note}
                    </p>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // RENDER REACT APP
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
